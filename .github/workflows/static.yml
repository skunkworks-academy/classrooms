# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Academy global shell on every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          current = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.2'
          loader = f'<script defer src="{current}" data-skunkworks-global-shell="2026.08.15.2"></script>'
          pages = []
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              html = path.read_text(encoding='utf-8', errors='ignore')
              if 'academy-navigation.js' in html:
                  html = re.sub(r'https://skunkworksacademy\.com/assets/academy-navigation\.js(?:\?v=[^"\'\s<>]+)?', current, html)
              elif '</head>' in html:
                  html = html.replace('</head>', f'  {loader}\n</head>', 1)
              elif '</body>' in html:
                  html = html.replace('</body>', f'  {loader}\n</body>', 1)
              else:
                  raise SystemExit(f'Cannot inject Academy shell into {path}')
              path.write_text(html, encoding='utf-8')
              pages.append(path)
          missing = [str(p) for p in pages if current not in p.read_text(encoding='utf-8', errors='ignore')]
          if missing:
              raise SystemExit('Global shell version missing from: ' + ', '.join(missing))
          print(f'Verified Academy global shell on {len(pages)} HTML page(s).')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
